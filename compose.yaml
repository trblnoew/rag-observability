name: rag-observability

services:
    postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-rag_observability}
            POSTGRES_USER: ${POSTGRES_USER:-rag_app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_local_password}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_app} -d ${POSTGRES_DB:-rag_observability}"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s
        restart: unless-stopped

    tempo:
        image: grafana/tempo:2.10.8
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        volumes:
            - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
        ports:
            - "3200:3200"
        restart: unless-stopped

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.159.0
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        volumes:
            - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
        ports:
            - "4317:4317"
            - "4318:4318"
            - "13133:13133"
        depends_on:
            - tempo
        restart: unless-stopped

    grafana:
        image: grafana/grafana:13.1.0
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
            GF_AUTH_DISABLE_LOGIN_FORM: "true"
        volumes:
            - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana-data:/var/lib/grafana
        ports:
            - "3000:3000"
        depends_on:
            - tempo
        restart: unless-stopped

volumes:
    postgres-data:
    tempo-data:
    grafana-data:

